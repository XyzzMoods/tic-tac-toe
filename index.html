<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-image: url('https://files.catbox.moe/op5los.jpg');
      background-size: cover;
      background-position: center;
      color: white;
    }

    .home, .game {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      color: red;
      text-shadow: 0 0 10px red;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 28px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff4444;
      color: white;
    }

    .game {
      background-image: url('https://files.catbox.moe/y9fdn3.jpg');
      background-size: cover;
      background-position: center;
      color: cyan;
      display: none;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 12px;
    }

    .cell {
      width: 100px;
      height: 100px;
      font-size: 2.5rem;
      border-radius: 20px;
      background-color: rgba(0,0,0,0.6);
      color: #00ccff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 10px #00ccff;
      transition: 0.2s;
    }

    .cell:hover {
      background-color: rgba(255,255,255,0.1);
    }

    .highlight {
      background-color: rgba(0,255,255,0.3) !important;
      box-shadow: 0 0 20px #00ffff;
    }

    .status {
      margin-top: 25px;
      font-size: 1.6rem;
      color: #00ffff;
      text-shadow: 0 0 6px #00ffff;
    }

    .rematch {
      margin-top: 20px;
      padding: 10px 24px;
      background: white;
      color: #66ccff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .rematch:hover {
      background: #66ccff;
      color: white;
    }
  </style>
</head>
<body>
  <div class="home">
    <h1>Tic Tac Toe</h1>
    <button onclick="startGame()">Start</button>
  </div>

  <div class="game">
    <div class="board" id="board">
      <!-- Cells will be inserted via JS -->
    </div>
    <div class="status" id="status"></div>
    <button class="Rematch" onclick="resetGame()">Rematch</button>
  </div>

  <script>
    const home = document.querySelector('.home');
    const game = document.querySelector('.game');
    const board = document.getElementById('board');
    const statusText = document.getElementById('status');

    let currentPlayer = 'X';
    let gameActive = true;
    let cells = [];

    const winPatterns = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function startGame() {
      home.style.display = 'none';
      game.style.display = 'flex';
      createBoard();
    }

    function createBoard() {
      board.innerHTML = '';
      cells = [];

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.dataset.index = i;
        cell.addEventListener('click', handleMove);
        board.appendChild(cell);
        cells.push(cell);
      }

      statusText.textContent = `Player ${currentPlayer}'s Turn`;
      gameActive = true;
    }

    function handleMove(e) {
      const cell = e.target;
      const index = cell.dataset.index;

      if (!gameActive || cell.textContent !== '') return;

      cell.textContent = currentPlayer;

      if (checkWin()) {
        statusText.textContent = `Player ${currentPlayer} Wins!`;
        gameActive = false;
      } else if (cells.every(c => c.textContent !== '')) {
        statusText.textContent = "It's a Draw!";
        gameActive = false;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusText.textContent = `Player ${currentPlayer}'s Turn`;
      }
    }

    function checkWin() {
      for (let pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (
          cells[a].textContent &&
          cells[a].textContent === cells[b].textContent &&
          cells[a].textContent === cells[c].textContent
        ) {
          cells[a].classList.add('highlight');
          cells[b].classList.add('highlight');
          cells[c].classList.add('highlight');
          return true;
        }
      }
      return false;
    }

    function resetGame() {
      currentPlayer = 'X';
      createBoard();
    }
  </script>
</body>
</html>
